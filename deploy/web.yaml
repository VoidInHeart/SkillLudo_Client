apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: skillludo
spec:
  selector: {app: skillludo-web}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: skillludo
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app: skillludo-web}
  template:
    metadata:
      labels: {app: skillludo-web}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: __WEB_IMAGE__
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          ports:
            - {name: http, containerPort: 8080}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 250m, memory: 64Mi}
          readinessProbe:
            httpGet: {path: /web-healthz, port: http}
          livenessProbe:
            httpGet: {path: /web-healthz, port: http}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-network
  namespace: skillludo
spec:
  podSelector:
    matchLabels: {app: skillludo-web}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: traefik}
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to:
        - podSelector:
            matchLabels: {app: skillludo-server}
      ports: [{protocol: TCP, port: 3000}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
# Additive allowance; the backend repository retains its own network policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-to-server
  namespace: skillludo
spec:
  podSelector:
    matchLabels: {app: skillludo-server}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: skillludo-web}
      ports: [{protocol: TCP, port: 3000}]
