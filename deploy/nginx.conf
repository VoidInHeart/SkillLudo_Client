worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 4096; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        # Preserve the existing root WebSocket URL while normal GET / serves Cocos.
        error_page 418 = @game;
        if ($http_upgrade != '') { return 418; }
        location @game {
            proxy_pass http://server:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 90s;
            proxy_send_timeout 90s;
            proxy_buffering off;
        }
        location = /healthz { proxy_pass http://server:3000; }
        location = /readyz { proxy_pass http://server:3000; }
        location = /web-healthz { access_log off; return 200 'ok'; }
        # Creator md5Cache fingerprints changed assets; cache only hashed names forever.
        location ~* "\.[0-9a-f]{5,}\.(js|json|css|png|jpg|jpeg|webp|svg|bin|wasm|ttf|woff2?)$" {
            add_header Cache-Control 'public, max-age=31536000, immutable';
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }
        location / {
            add_header Cache-Control 'no-cache';
            add_header X-Content-Type-Options nosniff always;
            try_files $uri $uri/ =404;
        }
    }
}
